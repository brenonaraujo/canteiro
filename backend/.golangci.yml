version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck
    - gocritic
    - revive
    - misspell
    - whitespace
    - gocyclo
    - funlen
    - gosec
    - testifylint
    - thelper
    - paralleltest
  settings:
    funlen:
      lines: 60
      statements: 50
      ignore-comments: true
    gocyclo:
      min-complexity: 25
    gosec:
      severity: medium
      confidence: medium
    govet:
      enable-all: true
    revive:
      severity: warning
      rules:
        - name: exported
          severity: warning
        - name: argument-limit
          arguments: [5]
        - name: max-control-nesting
          arguments: [4]
  exclusions:
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - funlen
          - paralleltest
      - path: internal/api/openapi\.gen\.go
        linters:
          - all
      # F4 cancellation fields are sized for legibility, not byte-packing;
      # fieldalignment warnings on the F4 surface are intentionally waived.
      - path: internal/domain/rental/cancellation\.go
        linters:
          - govet
        text: "fieldalignment"
      - path: internal/domain/rental/cancellation_test\.go
        linters:
          - govet
        text: "fieldalignment"
      - path: internal/rental/service\.go
        linters:
          - govet
        text: "fieldalignment"
      - path: internal/rental/cancel_test\.go
        linters:
          - govet
        text: "fieldalignment"
      - path: internal/repository/rental/rentalpg\.go
        linters:
          - govet
        text: "fieldalignment"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/api/openapi\.gen\.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
