openapi: 3.0.3
info:
  title: Canteiro API
  version: 0.4.0
  description: |
    F1 Conta: identidade Google, perfil mínimo, logout e desativação.
    F2 Catálogo: publicar, busca pública, operador declarado,
    calendário de disponibilidade e ficha pública.
    F3 Reserva: criar intent, autorizar pagamento (Stripe), webhook,
    aceitar/recusar pelo proprietário dentro da janela de 12h,
    recibo imutável do locatário.
  contact:
    name: Canteiro
    url: https://canteiro.brenon.cloud
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: ops
    description: Liveness, readiness
  - name: auth
    description: Google identity and session
  - name: account
    description: Profile and deactivation
  - name: listings
    description: Owner CRUD for listings (F2)
  - name: catalog
    description: Public discovery, calendar and ficha (F2)
  - name: rentals
    description: Tenant reservations and receipts (F3)
  - name: payments
    description: Payment authorization webhook (F3)
paths:
  /healthz:
    get:
      operationId: Healthz
      tags: [ops]
      summary: Liveness probe
      description: |
        Returns 200 when the HTTP process is alive.
        Does not check backing services.
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: Readyz
      tags: [ops]
      summary: Readiness probe
      description: |
        Returns 200 when backing services accept traffic.
        Returns 503 otherwise. Error payloads are generic (no DSN/PII).
        Localized `message` follows Accept-Language (en, pt-BR, es).
        Default locale is pt-BR.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /auth/google:
    get:
      operationId: StartGoogleAuth
      tags: [auth]
      summary: Start Google sign-in
      description: |
        Redirects to Google. Only Google creates a v1 account.
        Interrupted or refused consent creates neither account nor session.
      responses:
        "302":
          description: Redirect to Google
          headers:
            Location:
              schema:
                type: string
        "503":
          description: Identity provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/google/callback:
    get:
      operationId: GoogleCallback
      tags: [auth]
      summary: Google OAuth callback
      description: |
        Exchanges a valid Google code, creates or reopens the account,
        sets a session cookie, and redirects to the web app.
        Query params `code`, `state`, and `error` are read from the URL.
        The same Google subject never creates a second account.
        A deactivated account is reopened still deactivated.
      responses:
        "302":
          description: Redirect to the web app
          headers:
            Location:
              schema:
                type: string
  /auth/logout:
    post:
      operationId: Logout
      tags: [auth]
      summary: End the current session
      description: |
        Ends authenticated access. Does not deactivate the account
        and does not hide listings.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account:
    get:
      operationId: GetAccount
      tags: [account]
      summary: Current account
      description: |
        Returns the caller account. Never includes Google subject,
        email, or other identifiers beyond the public profile.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: UpdateAccount
      tags: [account]
      summary: Update visible name and phone
      description: |
        Empty name or phone is rejected. Completing both makes the
        account eligible to reserve (F3). Publishing stays blocked (F2).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /account/deactivate:
    post:
      operationId: DeactivateAccount
      tags: [account]
      summary: Deactivate own account
      description: |
        Irreversible in v1. Listings leave public search (F2 invariant).
        In-progress rentals are not cancelled (F3 invariant).
        Requires confirm=true.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateAccountRequest"
      responses:
        "200":
          description: Deactivated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /listings:
    get:
      operationId: ListMineListings
      tags: [listings]
      summary: List the caller's listings
      description: |
        Returns every listing owned by the authenticated account,
        regardless of state. Used for the owner dashboard.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Listings owned by the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: CreateListingDraft
      tags: [listings]
      summary: Create a draft listing
      description: |
        Creates a listing in `draft`. Drafts are not visible in public
        search. The owner must satisfy publish gates (photo, deposit
        minimum, cession declaration when heavy, operator identification
        when operator is required, valid delivery coverage when delivery
        is declared, payout details and owner terms) before the listing
        can move to `published`. Deactivated accounts cannot create
        listings; accounts without visible name and phone can persist a
        draft but cannot publish it.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /listings/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: GetMyListing
      tags: [listings]
      summary: Get one of the caller's listings (private)
      description: |
        Returns the listing with full owner data including operator
        identity and contact (only used by the owner).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: UpdateListing
      tags: [listings]
      summary: Update a draft or paused listing
      description: |
        Updates listing fields while in `draft` or `paused`. A published
        listing cannot be edited through this endpoint; the owner must
        pause it first, edit it, then publish again.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Listing is published; pause it before editing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /listings/{id}/publish:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: PublishListing
      tags: [listings]
      summary: Publish (or unpause) a listing
      description: |
        Moves a draft or paused listing into `published`. All publish
        gates are evaluated server-side. A listing that fails any gate
        stays in its current state and returns 422 with the missing field
        codes. Pausing is reversible by calling this endpoint again.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Listing published (or unpaused)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /listings/{id}/pause:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: PauseListing
      tags: [listings]
      summary: Pause a published listing
      description: |
        Pauses a published listing. It is removed from public search
        but data is preserved. It is not deleted.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Listing paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Listing is not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /listings/{id}/blocks:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: ListBlocks
      tags: [listings]
      summary: Owner view of availability blocks
      description: |
        Returns every availability block created by the owner. Used by
        the owner dashboard to manage the calendar.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: AddBlock
      tags: [listings]
      summary: Add an availability block
      description: |
        Adds a block to the listing calendar. Blocks must not overlap
        (the calendar is the single source of availability; F3 will
        honour this invariant on reservation).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBlockRequest"
      responses:
        "201":
          description: Block created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Block overlaps an existing block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /listings/{id}/blocks/{blockId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: blockId
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: RemoveBlock
      tags: [listings]
      summary: Remove an availability block
      description: |
        Removes a block created by the owner. Past blocks are kept
        for the audit log.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Block removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /owner/onboarding:
    get:
      operationId: GetOwnerOnboarding
      tags: [listings]
      summary: Owner onboarding state
      description: |
        Returns whether the owner has set payout details and accepted
        the owner terms. Both must be true before the owner can publish
        a listing.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Owner onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOnboarding"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: UpdateOwnerOnboarding
      tags: [listings]
      summary: Update payout details and/or accept terms
      description: |
        Updates owner-side onboarding data. Setting `accept_terms=true`
        records the acceptance timestamp and locks the published owner
        terms version. Payout details are stored as opaque strings in
        v1 (the actual Stripe Connect integration lands in F3).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnerOnboardingRequest"
      responses:
        "200":
          description: Owner onboarding updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOnboarding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /catalog/listings:
    get:
      operationId: SearchCatalog
      tags: [catalog]
      summary: Public search (no login required)
      description: |
        Search published listings. Supports filters by category, city,
        date interval (returning listings not blocked across the entire
        interval), operator mode, price range and size (light or heavy).
        Pages are 1-indexed with a fixed page size.
      parameters:
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/ListingCategory"
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: operator_mode
          schema:
            $ref: "#/components/schemas/OperatorMode"
        - in: query
          name: size
          schema:
            $ref: "#/components/schemas/ListingSize"
        - in: query
          name: min_price_cents
          schema:
            type: integer
            minimum: 0
        - in: query
          name: max_price_cents
          schema:
            type: integer
            minimum: 0
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Page of public listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPage"
  /catalog/listings/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: GetPublicListing
      tags: [catalog]
      summary: Public ficha (no login required)
      description: |
        Returns the public ficha for a published listing. Strips owner
        identity and operator identity/contact; only the public contact
        field (pix key, phone) declared on the publication is hidden
        until F3.
      responses:
        "200":
          description: Public ficha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListing"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog/listings/{id}/calendar:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: GetPublicCalendar
      tags: [catalog]
      summary: Public calendar (no login required)
      description: |
        Returns the list of date intervals the listing is unavailable,
        plus the minimum reservation lead time in hours. Does not reveal
        who reserved any interval.
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Public calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCalendar"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog/categories:
    get:
      operationId: ListCategories
      tags: [catalog]
      summary: Listing categories (config)
      description: |
        Returns the catalog of categories, including the deposit minimum
        per category (cents) required for publication.
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryConfig"
  /rentals:
    post:
      operationId: CreateRental
      tags: [rentals]
      summary: Create a reservation intent (tenant)
      description: |
        Validates the preconditions (tenant active, listing published,
        no calendar overlap, operator terms accepted when required), prices
        the rental and persists a `pending` rental. Idempotent on the
        (tenant, listing, window) tuple.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRentalRequest"
      responses:
        "201":
          description: Rental created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalQuoteOut"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      operationId: ListMyRentals
      tags: [rentals]
      summary: List the caller's rentals
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Rentals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rental"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rentals/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: GetRental
      tags: [rentals]
      summary: Get one rental
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Rental
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /rentals/{id}/authorize:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: AuthorizeRentalPayment
      tags: [rentals]
      summary: Authorize payment (tenant)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: PaymentIntent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /rentals/{id}/accept:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: AcceptRental
      tags: [rentals]
      summary: Accept the rental (owner)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Rental confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /rentals/{id}/decline:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: DeclineRental
      tags: [rentals]
      summary: Decline the rental (owner)
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineRentalRequest"
      responses:
        "200":
          description: Rental declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /rentals/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: CancelRental
      tags: [rentals]
      summary: Cancel the rental pre-acceptance (tenant)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Rental cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /rentals/{id}/receipt:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: GetRentalReceipt
      tags: [rentals]
      summary: Tenant receipt (immutable)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /payments/webhook:
    post:
      operationId: PaymentWebhook
      tags: [payments]
      summary: PSP webhook (signature verified server-side)
      parameters:
        - in: header
          name: Stripe-Signature
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookEvent"
      responses:
        "200":
          description: Event accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: canteiro_session
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: canteiro
    ReadyResponse:
      type: object
      required: [status, message, message_key]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          example: canteiro
        message:
          type: string
