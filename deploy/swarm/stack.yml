version: "3.9"
services:
  canteiro:
    image: ghcr.io/brenonaraujo/canteiro:latest
    networks:
      kong-apigateway_kong-net:
        aliases:
          - canteiro
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      LOG_LEVEL: info
      GIN_MODE: release
      METRICS_PATH: /metrics
      SERVICE_NAME: canteiro
      DEFAULT_LOCALE: pt-BR
      SHUTDOWN_TIMEOUT: 30s
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://canteiro.brenon.cloud/auth/google/callback
      SESSION_SECRET: ${SESSION_SECRET}
      WEB_APP_URL: https://canteiro.brenon.cloud
      SESSION_COOKIE_NAME: canteiro_session
      SESSION_COOKIE_SECURE: "true"
      SESSION_TTL: 168h
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 512M, cpus: "0.5" }
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - canteiro-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  migrate:
    image: migrate/migrate:v4.19.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: none

volumes:
  canteiro-postgres-data:

networks:
  kong-apigateway_kong-net:
    external: true